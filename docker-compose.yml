version: '3.9'
services:
  db:
    image: postgres:15
    container_name: jewelry-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: jewelry
    volumes:
      - dbdata:/var/lib/postgresql/data

volumes:
  dbdata: